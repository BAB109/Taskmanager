# ──────────────────────────────────────────────────────────────
#  render.yaml — TaskFlow Deployment Blueprint
#
#  Database: Neon (https://neon.tech) — Free forever, no expiry
#
#  How to use:
#    1. Create a free DB at https://neon.tech and copy the connection string
#    2. Push this repo to GitHub
#    3. Go to https://render.com → New → Blueprint
#    4. Connect your GitHub repo
#    5. When prompted, set DATABASE_URL to your Neon connection string
# ──────────────────────────────────────────────────────────────

services:
  # ── Web Service (Node.js + Express) ────────────────────────
  - type: web
    name: taskflow
    runtime: node
    region: singapore          # Change to: oregon, frankfurt, ohio, etc.
    plan: free                 # Free tier is fine — Neon handles the DB

    # Build & Start
    buildCommand: npm install
    startCommand: npm start    # Runs: node server.js

    # Health check — Render pings this to confirm app is up
    healthCheckPath: /api/health

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 3000

      # ⚠️ Set this manually in the Render dashboard after deploy:
      #    Render → Your Service → Environment → Add Variable
      #    Key:   DATABASE_URL
      #    Value: postgresql://user:password@ep-xxx.neon.tech/taskflow?sslmode=require
      - key: DATABASE_URL
        sync: false            # Tells Render to prompt you for this value

      # Optional: restrict CORS to your Render URL
      # - key: CORS_ORIGIN
      #   value: https://taskflow.onrender.com

    # Auto-deploy whenever you push to the main branch
    autoDeploy: true

# ── No databases section needed — using Neon (external) ───────
# Neon free tier benefits:
#   ✅ No 90-day expiry (permanent free tier)
#   ✅ 0.5 GB storage
#   ✅ Serverless auto-scaling
#   ✅ Built-in SSL (required by db/index.js already)
